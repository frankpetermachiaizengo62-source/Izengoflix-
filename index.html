<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IZENGOFLIX - Movies & Music</title>
  
  <!-- Fonti za Kisasa (Bebas Neue & Poppins Extra Bold) -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
  
  <style>
    /* RESET & BODY BASE */
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    body { 
      background-color: #060608; 
      color: #ffffff; 
      font-family: 'Poppins', sans-serif; 
      padding-bottom: 80px; 
      -webkit-font-smoothing: antialiased;
    }
    
    /* ---------------------------------------------------- */
    /* CATCHY & BOLD HEADER SECTION                         */
    /* ---------------------------------------------------- */
    header {
      text-align: center;
      padding: 60px 20px 40px;
      background: radial-gradient(circle at top, rgba(229, 9, 20, 0.35) 0%, rgba(6, 6, 8, 1) 85%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .logo { 
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(65px, 12vw, 110px); 
      font-weight: 900; /* Extremely Bold */
      letter-spacing: 10px;
      text-transform: uppercase;
      line-height: 1;
      
      /* Shiny Red Gradient */
      background: linear-gradient(180deg, #ffffff 0%, #ff1e27 45%, #b30006 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      
      /* Intense 3D Glow and Shadow Layers */
      filter: 
        drop-shadow(0 0 15px rgba(229, 9, 20, 0.9))
        drop-shadow(0 0 35px rgba(229, 9, 20, 0.6))
        drop-shadow(0 12px 25px rgba(0, 0, 0, 0.95));
        
      transition: transform 0.3s ease, filter 0.3s ease;
      display: inline-block;
      cursor: pointer;
    }
    
    .logo:hover {
      transform: scale(1.03);
      filter: 
        drop-shadow(0 0 25px rgba(255, 30, 39, 1))
        drop-shadow(0 0 55px rgba(229, 9, 20, 0.9));
    }
    
    .subtitle { 
      color: #e0e0e0; 
      font-size: 13px; 
      font-weight: 800; /* Extra Bold */
      margin-top: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9), 0 0 15px rgba(255, 255, 255, 0.2);
    }

    /* ---------------------------------------------------- */
    /* MAIN NAVIGATION TABS                                 */
    /* ---------------------------------------------------- */
    .main-tabs {
      display: flex;
      justify-content: center;
      background: rgba(12, 12, 16, 0.85);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .tab-btn {
      background: none;
      border: none;
      color: #777;
      font-size: 16px;
      font-weight: 800;
      padding: 18px 45px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
      letter-spacing: 1px;
    }
    
    .tab-btn.active { 
      color: #fff; 
      border-bottom: 3px solid #e50914; 
      background: rgba(229, 9, 20, 0.08);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }
    
    .tab-btn:hover { color: #fff; }

    /* ---------------------------------------------------- */
    /* CONTENT PANELS & CATEGORY PILLS                      */
    /* ---------------------------------------------------- */
    .panel { 
      display: none; 
      padding: 35px 20px; 
      max-width: 1400px; 
      margin: auto; 
    }
    .panel.active { display: block; }

    .sub-categories {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 15px;
      margin-bottom: 30px;
      scrollbar-width: none;
    }
    .sub-categories::-webkit-scrollbar { display: none; }

    .pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ccc;
      padding: 9px 22px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .pill.active, .pill:hover {
      background: #e50914;
      color: #fff;
      border-color: #e50914;
      box-shadow: 0 4px 18px rgba(229, 9, 20, 0.4);
    }

    /* ---------------------------------------------------- */
    /* MEDIA CARDS & GRID                                   */
    /* ---------------------------------------------------- */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 25px;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      backdrop-filter: blur(10px);
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(229, 9, 20, 0.2);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16/10;
      overflow: hidden;
      background: #111;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover .card-img-wrapper img {
      transform: scale(1.08);
    }

    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: #00e676;
      color: #000;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 6px;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .card-body {
      padding: 18px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-artist {
      color: #999;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .card-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 9px 0;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-play {
      background: #ffffff;
      color: #000;
    }

    .btn-play:hover {
      background: #e0e0e0;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
    }

    .btn-download {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-download:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <!-- HEADER WITH BOLD & GLOWING LOGO -->
  <header>
    <h1 class="logo">IZENGOFLIX</h1>
    <p class="subtitle">Movies & Music | Bongo to the World</p>
  </header>

  <!-- NAVIGATION TABS -->
  <nav class="main-tabs">
    <button class="tab-btn" onclick="switchTab('movies', event)">🎬 MOVIES</button>
    <button class="tab-btn active" onclick="switchTab('music', event)">🎵 MUSIC</button>
  </nav>

  <!-- MUSIC SECTION -->
  <section id="music" class="panel active">
    <div class="sub-categories">
      <button class="pill active">All Music</button>
      <button class="pill">🇹🇿 Bongo Fleva</button>
      <button class="pill">🌍 Africa</button>
      <button class="pill">🌎 Ulaya</button>
    </div>

    <div class="media-grid">
      <!-- Card Item 1 -->
      <div class="card">
        <div class="card-img-wrapper">
          <span class="badge">NEW</span>
          <img src="https://via.placeholder.com/400x250/111/fff?text=Diamond+Platnumz" alt="Cover">
        </div>
        <div class="card-body">
          <h3 class="card-title">Mwanangu</h3>
          <p class="card-artist">Diamond Platnumz | Bongo | 2026</p>
          <div class="card-actions">
            <button class="btn btn-play">▶ Play</button>
            <button class="btn btn-download">⬇ Download</button>
          </div>
        </div>
      </div>

      <!-- Card Item 2 -->
      <div class="card">
        <div class="card-img-wrapper">
          <img src="https://via.placeholder.com/400x250/111/fff?text=Harmonize" alt="Cover">
        </div>
        <div class="card-body">
          <h3 class="card-title">Single Again</h3>
          <p class="card-artist">Harmonize | Bongo | 2026</p>
          <div class="card-actions">
            <button class="btn btn-play">▶ Play</button>
            <button class="btn btn-download">⬇ Download</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- MOVIES SECTION -->
  <section id="movies" class="panel">
    <div class="sub-categories">
      <button class="pill active">All Movies</button>
      <button class="pill">Action</button>
      <button class="pill">Swahili Movies</button>
      <button class="pill">Series</button>
    </div>

    <div class="media-grid">
      <div class="card">
        <div class="card-img-wrapper">
          <span class="badge">HD</span>
          <img src="https://via.placeholder.com/400x250/111/fff?text=Action+Movie" alt="Cover">
        </div>
        <div class="card-body">
          <h3 class="card-title">The Legend</h3>
          <p class="card-artist">Action / Thriller • 2h 15m</p>
          <div class="card-actions">
            <button class="btn btn-play">▶ Watch</button>
            <button class="btn btn-download">⬇ Download</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- JAVASCRIPT FOR TAB SWITCHING -->
  <script>
    function switchTab(tabName, evt) {
      document.querySelectorAll('.panel').forEach(panel => {
        panel.classList.remove('active');
      });
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });

      document.getElementById(tabName).classList.add('active');
      evt.currentTarget.classList.add('active');
    }
  </script>

</body>
</html>
