<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IZENGOFLIX - Movies & Music</title>
<style>
  body { background: #141414; color: white; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
  h1 { text-align: center; color: #e50914; font-size: 40px; }
  
  /* MAIN TABS */
  .main-tabs {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 20px 0;
    border-bottom: 2px solid #333;
  }
  .tab-btn {
    background: none;
    border: none;
    color: #aaa;
    font-size: 20px;
    font-weight: bold;
    padding: 15px 30px;
    cursor: pointer;
    border-bottom: 3px solid transparent;
  }
  .tab-btn.active { color: #e50914; border-bottom: 3px solid #e50914; }
  
  /* PANELS */
  .panel { display: none; }
  .panel.active { display: block; }
  
  /* FILTERS */
  .filter-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; justify-content: center; }
  .filter-btn { background: #333; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; }
  .filter-btn.active { background: #e50914; }
  
  /* CARDS GRID */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
  .card { background: #222; border-radius: 10px; overflow: hidden; position: relative; }
  .card img { width: 100%; height: 300px; object-fit: cover; }
  .badge { position: absolute; top: 10px; left: 10px; background: #e50914; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
  .badge.new { background: #00ff00; color: black; }
  .badge.hd { background: #ffd700; color: black; }
  .card-info { padding: 10px; }
  .card-info h3 { margin: 5px 0; font-size: 16px; }
  .meta { color: #aaa; font-size: 12px; }
  .btn-group { display: flex; gap: 5px; margin-top: 10px; }
  .btn-group button { flex: 1; padding: 8px; border: none; border-radius: 5px; cursor: pointer; }
  .btn-group button:first-child { background: #e50914; color: white; }
  .btn-download { background: #444 !important; color: white; }
  
  /* MUSIC PLAYER */
  .music-player {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #1a1a1a;
    padding: 15px;
    display: flex;
    align-items: center;
    gap: 15px;
    border-top: 2px solid #e50914;
    z-index: 999;
  }
  .music-player img { width: 60px; height: 60px; border-radius: 8px; }
  .music-player audio { width: 300px; }
</style>
</head>
<body>

<h1>IZENGOFLIX</h1>

<!-- MAIN TABS -->
<div class="main-tabs">
  <button class="tab-btn active" onclick="showPanel('movies')">🎬 MOVIES</button>
  <button class="tab-btn" onclick="showPanel('music')">🎵 MUSIC</button>
</div>

<!-- MOVIES PANEL -->
<div id="moviesPanel" class="panel active">
  <div class="filter-buttons">
    <button class="filter-btn active" onclick="filterCat('all movie')">All Movies</button>
    <button class="filter-btn" onclick="filterCat('movie horror')">Horror</button>
    <button class="filter-btn" onclick="filterCat('movie action')">Action</button>
    <button class="filter-btn" onclick="filterCat('movie hd')">HD</button>
  </div>

  <div class="grid">
    <!-- SUZZANNA -->
    <div class="card" data-cat="movie horror hd indonesia">
      <span class="badge hd">HD</span>
      <img src="https://kxvmrlpanggrcqlfvsvq.supabase.co/storage/v1/object/public/Posters/Suzzanna-%20Witchcraft.jpg" alt="Suzzanna">
      <div class="card-info">
        <h3>Suzzanna: Queen of Black Magic</h3>
        <p class="meta">Horror | Indonesia | HD | 2018</p>
        <div class="btn-group">
          <button disabled style="opacity:0.6;">⏳ Coming Soon</button>
          <button class="btn-download" disabled style="opacity:0.6;">⬇️ Coming Soon</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MUSIC PANEL -->
<div id="musicPanel" class="panel">
  <div class="filter-buttons">
    <button class="filter-btn active" onclick="filterCat('all music')">All Music</button>
    <button class="filter-btn" onclick="filterCat('music bongo')">🇹🇿 Bongo</button>
    <button class="filter-btn" onclick="filterCat('music africa')">🌍 Africa</button>
    <button class="filter-btn" onclick="filterCat('music ulaya')">🌎 Ulaya</button>
  </div>

  <div class="grid">
    <!-- MFANO WA WIMBO - FUTA HUU UKIWEKA WAKO -->
    <div class="card" data-cat="music bongo single">
      <span class="badge new">NEW</span>
      <img src="https://via.placeholder.com/200x300/333/fff?text=Cover+Art" alt="Diamond">
      <div class="card-info">
        <h3>Jina la Wimbo</h3>
        <p class="meta">Artist: Jina la Msanii | Bongo | 2026</p>
        <div class="btn-group">
          <button onclick="playMusic('Jina la Wimbo','Jina la Msanii','LINK_COVER','LINK_AUDIO')">▶️ Play</button>
          <button class="btn-download" onclick="window.open('LINK_AUDIO','_blank')">⬇️ Download</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MUSIC PLAYER -->
<div id="musicPlayer" class="music-player" style="display:none;">
  <img id="playerCover" src="" alt="">
  <div>
    <h4 id="playerTitle">Title</h4>
    <p id="playerArtist">Artist</p>
    <audio id="audio" controls autoplay></audio>
  </div>
  <button onclick="closePlayer()">✖</button>
</div>

<script>
function showPanel(panel) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(panel + 'Panel').classList.add('active');
  event.target.classList.add('active');
}

function filterCat(cat) {
  document.querySelectorAll('.card').forEach(card => {
    if(cat.includes('all') || card.dataset.cat.includes(cat)) {
      card.style.display = 'block';
    } else {
      card.style.display = 'none';
    }
  });
}

function playMusic(title, artist, cover, audioLink) {
  document.getElementById('musicPlayer').style.display = 'flex';
  document.getElementById('playerTitle').innerText = title;
  document.getElementById('playerArtist').innerText = artist;
  document.getElementById('playerCover').src = cover;
  document.getElementById('audio').src = audioLink;
}
