<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<title>IZENGOFLIX TEST</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { background: #000; color: white; font-family: Arial; padding: 40px; text-align: center; }
  .logo { font-size: 60px; color: #e50914; font-weight: bold; }
  .box { background: #111; padding: 30px; border-radius: 10px; margin: 20px auto; max-width: 600px; border: 2px solid #e50914; }
  .error { color: #ff4757; }
  .success { color: #00ff88; }
  button { background: #e50914; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 18px; cursor: pointer; margin: 10px; }
</style>
</head>
<body>

<div class="logo">IZENGOFLIX</div>
<h2>TEST YA SUPABASE CONNECTION</h2>

<div class="box">
  <h3 id="status">Inajaribu kuunganisha...</h3>
  <p id="details"></p>
  <button onclick="loadSongs()">BONGEZA UPIMA TENA</button>
  <button onclick="showPanel('music')">INGIA MUSIC</button>
</div>

<div id="musicPanel" style="display:none;">
  <div id="musicGrid"></div>
</div>

<script>
// ========= ⚠️ WEKA CREDENTIALS ZAKO HAPA =========
const SUPABASE_URL = 'https://WEKA_YAKO_HAPA.supabase.co'; 
const SUPABASE_ANON_KEY = 'WEKA_KEY_YAKO_KIRENGU_HAPA'; 
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadSongs() {
  document.getElementById('status').innerHTML = "Inajaribu kuunganisha...";
  document.getElementById('details').innerHTML = "";

  if(SUPABASE_URL.includes('WEKA_YAKO')) {
    document.getElementById('status').className = 'error';
    document.getElementById('status').innerHTML = "❌ KOSA: HUJAWEKA KEYS";
    document.getElementById('details').innerHTML = "Nenda line 33 na 34 uweke URL na KEY zako za kweli kutoka Supabase";
    return;
  }

  const { data, error } = await supabase.from('songs').select('*');
  
  if(error) { 
    document.getElementById('status').className = 'error';
    document.getElementById('status').innerHTML = "❌ HAIKUUNGANISHWA";
    document.getElementById('details').innerHTML = "Error: " + error.message + "<br><br> Suluhisho: 1. Angalia jina la table ni 'songs' 2. Nenda Supabase > SQL > run: `alter table songs enable row level security;` kisha `create policy 'Allow all' on songs for all using (true);`";
    return; 
  }
  
  document.getElementById('status').className = 'success';
  document.getElementById('status').innerHTML = "✅ IMEUNGANISHWA! Nyimbo: " + data.length;
  document.getElementById('details').innerHTML = JSON.stringify(data);
  displaySongs(data);
}

function displaySongs(songs) {
  document.getElementById('musicGrid').innerHTML = songs.map(s => `<p>${s.title} - ${s.artist}</p>`).join('');
}

function showPanel(p) {
  document.getElementById('musicPanel').style.display = 'block';
  loadSongs();
}

loadSongs(); // Ijaribu moja kwa moja
</script>
</body>
</html>
