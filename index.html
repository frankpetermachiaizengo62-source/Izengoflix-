<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IZENGOFLIX - Movies & Music</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: #0a0a0a; 
    color: white; 
    font-family: 'Poppins', sans-serif; 
    padding-bottom: 120px; 
  }
  
  /* HEADER */
  header {
    text-align: center;
    padding: 30px 20px;
    background: linear-gradient(180deg, #000 0%, #0a0a0a 100%);
  }
  h1 { 
    color: #e50914; 
    font-size: 50px; 
    font-weight: 700;
    letter-spacing: 3px;
    text-shadow: 0 0 20px rgba(229, 9, 20, 0.5);
  }
  .subtitle { color: #aaa; font-size: 14px; margin-top: 5px; }

  /* MAIN TABS */
  .main-tabs {
    display: flex;
    justify-content: center;
    gap: 0;
    background: #111;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .tab-btn {
    background: none;
    border: none;
    color: #888;
    font-size: 18px;
    font-weight: 600;
    padding: 18px 50px;
    cursor: pointer;
    transition: 0.3s;
    border-bottom: 3px solid transparent;
  }
  .tab-btn.active { 
    color: white; 
    background: #1a1a1a;
    border-bottom: 3px solid #e50914; 
  }
  .tab-btn:hover { color: white; background: #1a1a1a; }
  
  /* PANELS */
  .panel { display: none; padding: 30px 20px; max-width: 1400px; margin: auto; }
  .panel.active { display: block; }
  
  /* FILTERS */
  .filter-buttons { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 30px; }
  .filter-btn { 
    background: #222; 
    color: #ccc; 
    border: 1px solid #333; 
    padding: 10px 20px; 
    border-radius: 30px; 
    cursor: pointer; 
    font-weight: 600;
    transition: 0.3s;
  }
  .filter-btn.active, .filter-btn:hover { 
    background: #e50914; 
    color: white; 
    border-color: #e50914;
  }
  
  /* CARDS GRID */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 25px; }
  .card { 
    background: #1a1a1a; 
    border-radius: 12px; 
    overflow: hidden; 
    position: relative; 
    transition: 0.3s;
    border: 1px solid #222;
  }
  .card:hover { 
    transform: translateY(-8px); 
    border-color: #e50914;
    box-shadow: 0 10px 30px rgba(229, 9, 20, 0.3);
  }
  .card img { width: 100%; height: 340px; object-fit: cover; }
  .badge { 
    position: absolute; top: 12px; left: 12px; 
    background: #e50914; padding: 6px 12px; 
    border-radius: 6px; font-size: 11px; font-weight: 700; 
    text-transform: uppercase;
  }
  .badge.new { background: #00ff88; color: black; }
  .badge.hd { background: #ffd700; color: black; }
  .card-info { padding: 15px; }
  .card-info h3 { margin: 5px 0; font-size: 17px; font-weight: 600; }
  .meta { color: #888; font-size: 13px; }
  .btn-group { display: flex; gap: 10px; margin-top: 12px; }
  .btn-group button { 
    flex: 1; padding: 10px; border: none; border-radius: 8px; 
    cursor: pointer; font-weight: 600; font-family: 'Poppins';
    transition: 0.3s;
  }
  .btn-play { background: #e50914; color: white; }
  .btn-play:hover { background: #f40612; }
  .btn-download { background: #333; color: white; }
  .btn-download:hover { background: #444; }
  
  /* MUSIC PLAYER */
  .music-player {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #111;
    padding: 15px 30px;
    display: flex;
    align-items: center;
    gap: 20px;
    border-top: 2px solid #e50914;
    z-index: 999;
    backdrop-filter: blur(10px);
  }
  .music-player img { width: 65px; height: 65px; border-radius: 10px; }
  .music-player audio { width: 100%; max-width: 500px; }
  .music-player h4 { font-size: 16px; }
  .music-player p { font-size: 13px; color: #aaa; }
</style>
</head>
<body>

<header>
  <h1>IZENGOFLIX</h1>
  <p class="subtitle">Movies & Music | Bongo to the World</p>
</header>

<!-- MAIN TABS -->
<div class="main-tabs">
  <button class="tab-btn active" onclick="showPanel('movies', this)">🎬 MOVIES</button>
  <button class="tab-btn" onclick="showPanel('music', this)">🎵 MUSIC</button>
</div>

<!-- MOVIES PANEL -->
<div id="moviesPanel" class="panel active">
  <div class="filter-buttons">
    <button class="filter-btn active" onclick="filterCat('all movie', this)">All Movies</button>
    <button class="filter-btn" onclick="filterCat('movie horror', this)">Horror</button>
    <button class="filter-btn" onclick="filterCat('movie action', this)">Action</button>
    <button class="filter-btn" onclick="filterCat('movie hd', this)">HD</button>
  </div>

  <div class="grid">
    <div class="card" data-cat="movie horror hd indonesia">
      <span class="badge hd">HD</span>
      <img src="https://kxvmrlpanggrcqlfvsvq.supabase.co/storage/v1/object/public/Posters/Suzzanna-%20Witchcraft.jpg" alt="Suzzanna">
      <div class="card-info">
        <h3>Suzzanna: Queen of Black Magic</h3>
        <p class="meta">Horror | Indonesia | 2018</p>
        <div class="btn-group">
          <button disabled style="opacity:0.5;">⏳ Coming Soon</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MUSIC PANEL -->
<div id="musicPanel" class="panel">
  <div class="filter-buttons">
    <button class="filter-btn active" onclick="filterCat('all music', this)">All Music</button>
    <button class="filter-btn" onclick="filterCat('music bongo', this)">🇹🇿 Bongo Fleva</button>
    <button class="filter-btn" onclick="filterCat('music africa', this)">🌍 Africa</button>
    <button class="filter-btn" onclick="filterCat('music ulaya', this)">🌎 Ulaya</button>
  </div>

  <div class="grid">
    <div class="card" data-cat="music bongo single">
      <span class="badge new">NEW</span>
      <img src="https://via.placeholder.com/230x340/1a1a1a/e50914?text=Diamond" alt="Diamond">
      <div class="card-info">
        <h3>Mwanangu</h3>
        <p class="meta">Diamond Platnumz | Bongo | 2026</p>
        <div class="btn-group">
          <button class="btn-play" onclick="playMusic('Mwanangu','Diamond Platnumz','https://via.placeholder.com/230x340/1a1a1a/e50914?text=Diamond','https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3')">▶️ Play</button>
          <button class="btn-download" onclick="window.open('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3','_blank')">⬇️ Download</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MUSIC PLAYER -->
<div id="musicPlayer" class="music-player" style="display:none;">
  <img id="playerCover" src="" alt="">
  <div style="flex:1;">
    <h4 id="playerTitle">Title</h4>
    <p id="playerArtist">Artist</p>
    <audio id="audio" controls autoplay style="margin-top:5px;"></audio>
  </div>
  <button onclick="closePlayer()" style="background:#e50914; color:white; border:none; padding:12px 18px; border-radius:8px; font-size:18px; cursor:pointer; font-weight:700;">✖</button>
</div>

<script>
function showPanel(panel, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(panel + 'Panel').classList.add('active');
  btn.classList.add('active');
  window.scrollTo(0,0);
}

function filterCat(cat, btn) {
  btn.parentElement.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.card').forEach(card => {
    if(cat.includes('all') || card.dataset.cat.includes(cat)) {
      card.style.display = 'block';
    } else {
      card.style.display = 'none';
    }
  });
}

function playMusic(title, artist, cover, audioLink) {
  document.getElementById('musicPlayer').style.display = 'flex';
  document.getElementById('playerTitle').innerText = title;
  document.getElementById('playerArtist').innerText = artist;
  document.getElementById('playerCover').src = cover;
  document.getElementById('audio').src = audioLink;
}
function closePlayer() {
  document.getElementById('musicPlayer').style.display = 'none';
  document.getElementById('audio').pause();
  document.getElementById('audio').src = "";
}
</script>

</body>
</html>
