<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IZENGOFLIX</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; color: white; font-family: 'Poppins', sans-serif; padding-bottom: 120px; }
  header { text-align: center; padding: 50px 20px 30px; background: linear-gradient(180deg, rgba(229,9,20,0.1) 0%, #000 100%); }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 80px; letter-spacing: 8px; background: linear-gradient(90deg, #e50914, #ff4757); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { color: #aaa; font-size: 15px; margin-top: 8px; letter-spacing: 2px; text-transform: uppercase; }
  .main-tabs { display: flex; justify-content: center; background: #0a0a0a; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 10; }
  .tab-btn { background: none; border: none; color: #666; font-size: 20px; font-weight: 700; padding: 20px 60px; cursor: pointer; transition: 0.3s; letter-spacing: 1px; }
  .tab-btn.active { color: white; border-bottom: 3px solid #e50914; background: #111; }
  .panel { display: none; padding: 40px 30px; max-width: 1500px; margin: auto; }
  .panel.active { display: block; }
  .filter-buttons { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 40px; justify-content: center; }
  .filter-btn { background: #111; color: #bbb; border: 1px solid #333; padding: 12px 24px; border-radius: 30px; cursor: pointer; font-weight: 600; transition: 0.3s; }
  .filter-btn.active, .filter-btn:hover { background: #e50914; color: white; border-color: #e50914; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 30px; }
  .card { background: #111; border-radius: 15px; overflow: hidden; transition: 0.4s; border: 1px solid #1a1a1a; position: relative; }
  .card:hover { transform: translateY(-10px); border-color: #e50914; box-shadow: 0 15px 40px rgba(229, 9, 20, 0.4); }
  .card img { width: 100%; height: 350px; object-fit: cover; }
  .badge { position: absolute; top: 15px; left: 15px; background: #e50914; padding: 7px 14px; border-radius: 6px; font-size: 11px; font-weight: 700; z-index:2; }
  .badge.new { background: #00ff88; color: #000; }
  .card-info { padding: 18px; }
  .card-info h3 { margin: 5px 0; font-size: 18px; font-weight: 700; }
  .meta { color: #888; font-size: 13px; }
  .btn-group { display: flex; gap: 12px; margin-top: 15px; }
  .btn-group button { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; transition: 0.3s; }
  .btn-play { background: #e50914; color: white; }
  .btn-download { background: #222; color: white; border: 1px solid #333; }
  .music-player { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,10,10,0.95); padding: 20px 40px; display: flex; align-items: center; gap: 25px; border-top: 2px solid #e50914; z-index: 999; backdrop-filter: blur(20px); }
  .music-player img { width: 70px; height: 70px; border-radius: 12px; object-fit: cover; }
  .music-player audio { width: 100%; max-width: 600px; }
  .loading, .error { text-align: center; padding: 50px; color: #aaa; font-size: 20px; grid-column: 1 / -1; }
  .error { color: #ff4757; background: #1a0000; border: 1px solid #ff4757; border-radius: 10px; }
</style>
</head>
<body>

<header>
  <div class="logo">IZENGOFLIX</div>
  <p class="subtitle">Premium Movies & Music • Bongo to the World</p>
</header>

<div class="main-tabs">
  <button class="tab-btn active" onclick="showPanel('movies', event)">🎬 MOVIES</button>
  <button class="tab-btn" onclick="showPanel('music', event)">🎵 MUSIC</button>
</div>

<div id="moviesPanel" class="panel active">
  <h2 style="text-align:center; margin-bottom:30px;">Movies Zitakuja Hapa</h2>
</div>

<div id="musicPanel" class="panel">
  <div class="filter-buttons">
    <button class="filter-btn active" onclick="filterMusic('all', event)">All Music</button>
    <button class="filter-btn" onclick="filterMusic('bongo', event)">🇹🇿 Bongo</button>
    <button class="filter-btn" onclick="filterMusic('africa', event)">🌍 Africa</button>
    <button class="filter-btn" onclick="filterMusic('ulaya', event)">🌎 Ulaya</button>
  </div>
  <div id="musicGrid" class="grid">
    <div class="loading">Inapakia nyimbo kutoka Supabase...</div>
  </div>
</div>

<div id="musicPlayer" class="music-player" style="display:none;">
  <img id="playerCover" src="" alt="">
  <div style="flex:1;">
    <h4 id="playerTitle">Title</h4>
    <p id="playerArtist" style="color:#aaa;">Artist</p>
    <audio id="audio" controls autoplay style="margin-top:8px; width:100%;"></audio>
  </div>
  <button onclick="closePlayer()" style="background:#e50914; color:white; border:none; padding:14px 20px; border-radius:10px; font-size:20px; cursor:pointer; font-weight:700;">✖</button>
</div>
