<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IZENGOFLIX - Movies & Music</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: #000; 
    color: white; 
    font-family: 'Poppins', sans-serif; 
    padding-bottom: 120px; 
  }
  
  /* HEADER CLASSY */
  header {
    text-align: center;
    padding: 50px 20px 30px;
    background: linear-gradient(180deg, rgba(229,9,20,0.1) 0%, #000 100%);
  }
  .logo { 
    font-family: 'Bebas Neue', sans-serif;
    font-size: 80px; 
    font-weight: 400;
    letter-spacing: 8px;
    background: linear-gradient(90deg, #e50914, #ff4757, #e50914);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-size: 200% auto;
    animation: shine 3s linear infinite;
    text-shadow: 0 0 40px rgba(229, 9, 20, 0.4);
  }
  @keyframes shine {
    to { background-position: 200% center; }
  }
  .subtitle { 
    color: #aaa; 
    font-size: 15px; 
    margin-top: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* MAIN TABS PREMIUM */
  .main-tabs {
    display: flex;
    justify-content: center;
    gap: 0;
    background: #0a0a0a;
    border-bottom: 1px solid #222;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .tab-btn {
    background: none;
    border: none;
    color: #666;
    font-size: 20px;
    font-weight: 700;
    padding: 20px 60px;
    cursor: pointer;
    transition: 0.3s;
    font-family: 'Poppins';
    letter-spacing: 1px;
  }
  .tab-btn.active { 
    color: white; 
    border-bottom: 3px solid #e50914; 
    background: #111;
  }
  .tab-btn:hover { color: white; }
