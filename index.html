<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IZENGOFLIX - Movies & Music</title>
<style>
  body { background: #141414; color: white; font-family: Arial, sans-serif; margin: 0; padding: 20px; padding-bottom: 120px; }
  h1 { text-align: center; color: #e50914; font-size: 40px; margin-bottom: 10px; }
  
  /* MAIN TABS */
  .main-tabs {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin: 20px 0;
    border-bottom: 2px solid #333;
  }
  .tab-btn {
    background: none;
    border: none;
    color: #aaa;
    font-size: 22px;
    font-weight: bold;
    padding: 15px 40px;
    cursor: pointer;
    border-bottom: 4px solid transparent;
    transition: 0.3s;
  }
  .tab-btn.active { color: #e50914; border-bottom: 4px solid #e50914; }
  
  /* PANELS */
  .panel { display: none; }
  .panel.active { display: block; }
  
  /* FILTERS */
  .filter-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; justify-content: center; }
  .filter-btn { background: #333; color: white; border: none; padding: 10px 18px; border-radius: 25px; cursor: pointer; font-weight: bold; }
  .filter-btn.active { background: #e50914; }
  
  /* CARDS GRID */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
  .card { background: #222; border-radius: 10px; overflow: hidden; position: relative; transition: 0.3s; }
  .card:hover { transform: scale(1.03); }
  .card img { width: 100%; height: 320px; object-fit: cover; }
  .badge { position: absolute; top: 10px; left: 10px; background: #e50914; padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
  .badge.new { background: #00ff00; color: black; }
  .badge.hd { background: #ffd700; color: black; }
  .card-info { padding: 12px; }
  .card-info h3 { margin: 5px 0; font-size: 16px; }
  .meta { color: #aaa; font-size: 12px; }
  .btn-group { display: flex; gap: 8px; margin-top: 10px; }
  .btn-group button { flex: 1; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
  .btn-play { background: #e50914; color: white; }
  .btn-download { background: #444; color: white; }
  
  /* MUSIC PLAYER */
  .music-player {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #1a1a1a;
    padding: 15px 20px;
    display: flex;
    align-items: center;
    gap: 15px;
    border-top: 3px solid #e50914;
    z-index: 999;
  }
  .music-player img { width: 60px; height: 60px; border-radius: 8px; }
  .music-player audio { width: 100%; max-width: 400px; }
  .music-player h4, .music-player p { margin: 0; }
</style>
</head>
<body>

<h1>IZENGOFLIX</h1>

<!-- MAIN TABS -->
<div class="main-tabs">
  <button class="tab-btn active" onclick="showPanel('movies', this)">🎬 MOVIES</button>
  <button class="tab-btn" onclick="showPanel('music', this)">🎵 MUSIC</button>
</div>

<!-- MOVIES PANEL -->
<div id="moviesPanel" class="panel active">
  <div class="filter-buttons">
    <button class="filter-btn active" onclick="filterCat('all movie', this)">All Movies</button>
    <button class="filter-btn" onclick="filterCat('movie horror', this)">Horror</button>
    <button class="filter-btn" onclick="filterCat('movie action', this)">Action</button>
    <button class="filter-btn" onclick="filterCat('movie hd', this)">HD</button>
    <button class="filter-btn" onclick="filterCat('movie indonesia', this)">Indonesia</button>
  </div>

  <div class="grid">
    <!-- SUZZANNA -->
    <div class="card" data-cat="movie horror hd indonesia">
      <span class="badge hd">HD</span>
      <img src="https://kxvmrlpanggrcqlfvsvq.supabase.co/storage/v1/object/public/Posters/Suzzanna-%20Witchcraft.jpg" alt="Suzzanna">
      <div class="card-info">
        <h3>Suzzanna: Queen of Black Magic</h3>
        <p class="meta">Horror | Indonesia | HD | 2018</p>
        <div class="btn-group">
          <button disabled style="opacity:0.6;">⏳ Coming Soon</button>
          <button class="btn-download" disabled style="opacity:0.6;">⬇️ Coming Soon</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MUSIC PANEL -->
<div id="musicPanel" class="panel">
  <div class="filter-buttons">
    <button class="filter-btn active" onclick="filterCat('all music', this)">All Music</button>
    <button class="filter-btn" onclick="filterCat('music bongo', this)">🇹🇿 Bongo</button>
    <button class="filter-btn" onclick="filterCat('music africa', this)">🌍 Africa</button>
    <button class="filter-btn" onclick="filterCat('music ulaya', this)">🌎 Ulaya</button>
    <button class="filter-btn" onclick="filterCat('music single', this)">Singles</button>
  </div>

  <div class="grid">
    <!-- MFANO WA WIMBO 1 -->
    <div class="card" data-cat="music bongo single">
      <span class="badge new">NEW</span>
      <img src="https://via.placeholder.com/220x320/333/fff?text=Diamond" alt="Diamond">
      <div class="card-info">
        <h3>Mwanangu</h3>
        <p class="meta">Artist: Diamond Platnumz | Bongo | 2026</p>
        <div class="btn-group">
          <button class="btn-play" onclick="playMusic('Mwanangu','Diamond Platnumz','https://via.placeholder.com/220x320/333/fff?text=Diamond','https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3')">▶️ Play</button>
          <button class="btn-download" onclick="window.open('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3','_blank')">⬇️ Download</button>
        </div>
      </div>
    </div>

    <!-- MFANO WA WIMBO 2 -->
    <div class="card" data-cat="music africa single">
      <span class="badge new">HOT</span>
      <img src="https://via.placeholder.com/220x320/333/fff?text=Burna" alt="Burna Boy">
      <div class="card-info">
        <h3>Last Last</h3>
        <p class="meta">Artist: Burna Boy | Africa | 2022</p>
        <div class="btn-group">
          <button class="btn-play" onclick="playMusic('Last Last','Burna Boy','https://via.placeholder.com/220x320/333/fff?text=Burna','https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3')">▶️ Play</button>
          <button class="btn-download" onclick="window.open('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3','_blank')">⬇️ Download</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MUSIC PLAYER -->
<div id="musicPlayer" class="music-player" style="display:none;">
  <img id="playerCover" src="" alt="">
  <div style="flex:1;">
    <h4 id="playerTitle">Title</h4>
    <p id="playerArtist">Artist</p>
    <audio id="audio" controls autoplay></audio>
  </div>
  <button onclick="closePlayer()" style="background:red; color:white; border:none; padding:10px 15px; border-radius:5px; font-size:18px; cursor:pointer;">✖</button>
</div>

<script>
function showPanel(panel, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(panel + 'Panel').classList.add('active');
  btn.classList.add('active');
}

function filterCat(cat, btn) {
  btn.parentElement.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  document.querySelectorAll('.card').forEach(card => {
    if(cat.includes('all') || card.dataset.cat.includes(cat)) {
      card.style.display = 'block';
    } else {
      card.style.display = 'none';
    }
  });
}

function playMusic(title, artist, cover, audioLink) {
  document.getElementById('musicPlayer').style.display = 'flex';
  document.getElementById('playerTitle').innerText = title;
  document.getElementById('playerArtist').innerText = artist;
  document.getElementById('playerCover').src = cover;
  document.getElementById('audio').src = audioLink;
}
function closePlayer() {
  document.getElementById('musicPlayer').style.display = 'none';
  document.getElementById('audio').pause();
  document.getElementById('audio').src = "";
}
</script>

</body>
</html>
